eft: the DOT4 core routes at a median 35.94 MHz, the core without DOT4 at 40.37 MHz.</text><text x="0.0" y="454.0" font-size="13" fill="#B7B8B1" text-anchor="start">Each DOT4-core cycle is 12.3% longer, so every cycle ratio is multiplied by 35.94 / 40.37 = 0.890.</text><text x="0.0" y="474.0" font-size="13" fill="#B7B8B1" text-anchor="start">The range pairs the slowest DOT4 seed (34.51 MHz) with the fastest DOT4=0 seed (43.25 MHz), and the reverse.</text></g><text x="24.0" y="602.0" font-size="12" fill="#B7B8B1" text-anchor="start">Source: reports/ablation.json, cycles from Icarus, Fmax post-route estimates on iCE40 HX8K</text></svg>