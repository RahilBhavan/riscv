name: Build complete project
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PDF verification tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check the committed package matches the committed tree
        run: python3 scripts/release/build.py --check-committed
      - name: Build and verify the complete project
        env:
          CHROMIUM_BIN: google-chrome
        run: make all
      - name: Committed test evidence matches a fresh run
        run: git diff --exit-code -- reports/verification.json reports/raw/regression.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-riscv-project
          path: |
            reports/
            output/riscv-project.zip
            output/START-HERE.html
            output/textbook/
            output/visual-lab/
            build/project/
            build/regression.log
            build/synthesis.log
            build/nextpnr.log
            build/timing.json
            build/merged.dat
            build/learning-series/
            build/visual-lab/
