name: Verify core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build tool image
        run: docker build -t rv32-tools .
      - name: Differential tests, teaching labs, lint and coverage
        run: docker run --rm -v "$PWD:/work" rv32-tools make test learning-labs reset-test lint coverage
      - name: Open-source synthesis and place-and-route
        run: docker run --rm -v "$PWD:/work" rv32-tools make timing visual-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Visual teaching models and evidence consistency
        run: make visual-models visual-lab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-and-implementation
          path: |
            reports/
            build/regression.log
            build/synthesis.log
            build/nextpnr.log
            build/timing.json
            build/merged.dat
            build/learning-series/
            build/visual-lab/
            output/visual-lab/
