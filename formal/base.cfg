# riscv-formal checks for the base core. Depths are cycles from reset.
[options]
isa rv32i
nret 1

[depth]
insn            20
reg        10   20
pc_fwd     10   20
pc_bwd     10   20
unique     1 10 20
causal     10   20
liveness   1 10 30
cover      1    20
ill             20

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RV32_DOT4 1
`define RV32_MEXT 0
`define RV32_ZICSR 0

[defines liveness]
`define RV32_FAIRNESS

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/rv32_core.sv

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 4);
