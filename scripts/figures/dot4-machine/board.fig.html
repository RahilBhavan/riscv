<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iCE40-HX8K Breakout</title><style>#fig{max-height:none!important}</style></head><body>
<script src="core.js"></script>
<script>/*__DATA__*/</script>
<script>
/* Lattice iCE40-HX8K Breakout Board (ICE40HX8K-B-EVN) running board_top (rtl/board_top.sv), simulated.
   Units are mm. The board is about 76 x 76 mm (Lattice forum answer). The part placement is simplified.
   How the self-test runs:
     1. USB power arrives through the mini-B port. The FPGA loads its image from the SPI flash; CDONE lights.
     2. A power-on counter holds the core in reset for 2^POR_BITS cycles of the 12 MHz oscillator.
     3. The core runs the self-checking program in a loop. Each loop stores a signature to 0x2000.
     4. board_top compares it with the expected value. LEDs: 0 heartbeat, 1 retired bit, 2 PASS, 3 FAIL,
        4..7 the pass counter on PASS or the cause bits on FAIL.
   Parts: PCB . four standoffs . FPGA (CT256 BGA) . FT2232H USB bridge . USB mini-B port . 12 MHz oscillator .
   SPI flash . J6/J7 jumpers . LED0..LED7 . CDONE LED . power LED . header pads . USB cable and plug.
   See-through: the FPGA package opens to a die map (logic and block RAM in use, from reports/board.json) and the copper
   traces show which signals are live. */
const bdW = 76, bdD = 76, bdZ0 = 5, bdT = 6.6, bdH = 13;
const PCB = { l:'#3f9a63', m:'#2f7d4f', d:'#1d4f33' }, SILK = '#f4f1e6', GOLD = { l:'#f1d27a', m:'#d2ae4f', d:'#8f7427' };
const BLACK = { l:'#4a4744', m:'#2f2d2b', d:'#1d1c1a' };
const bdFPGA = { x0: 30, x1: 44, y0: 24, y1: 38 }, bdFTDI = { x0: 16, x1: 25, y0: 52, y1: 61 };
const bdLEDX = 63, bdLEDY = i => 52 - i*4.6;
const B = FIGDATA.board, F = B.clockMHz * 1e6, bdReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const bdFAULTS = [
  { label: 'No fault (PASS)', cause: -1 },
  { label: 'Wrong signature', cause: 0 },
  { label: 'Trap', cause: 1 },
  { label: 'Watchdog', cause: 2 },
  { label: 'Retire count', cause: 3 },
];

const bdTxZ = (x, y, z, str, size, col = SILK, weight = 700) => { const o = P(x, y, z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(1,0,0))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}">${str}</text>`; };
const bdCorners = (x0,y0,z0,x1,y1,z1) => { const o = []; for (const x of [x0,x1]) for (const y of [y0,y1]) for (const z of [z0,z1]) o.push([x,y,z]); return o; };
const bdBox = (x0,y0,z0,x1,y1,z1,m,w = 1.2) => box(x0,y0,z0,x1,y1,z1,m,toneI,.6) + hullInk(bdCorners(x0,y0,z0,x1,y1,z1), w);
const bdDisc = (x, y, z, r, n = 12) => pd(on(PZ(z), ellUV(x, y, r, r, n)));

/* what the LEDs show at time t after configuration (board_top.sv lines for leds[0..7]).
   cycles come from the 12 MHz clock in reports/board.json. LED1 and the pass counter assume one instruction per
   cycle (an upper bound), so they run a little faster than a real board would. */
function bdLeds(st){
  const leds = Array(8).fill(0);
  if (!st.cfg) return leds;
  const cyc = st.t * F, bit = (v, b) => Math.floor(v / 2 ** b) % 2;
  leds[0] = bit(cyc, B.rtl.heartbeatBit);
  const reset = cyc < 2 ** B.rtl.porBits, running = !reset;
  const cause = st.fault < 0 ? -1 : st.fault;
  const failAt = cause === 2 ? 2 ** B.rtl.watchdogBits : cause === 3 ? 2 * B.retiredPerPass : 0;
  const failed = running && cause >= 0 && cyc - 2 ** B.rtl.porBits >= failAt;
  const run = running ? cyc - 2 ** B.rtl.porBits : 0;
  leds[1] = bit(run, B.rtl.retireBit);
  const passes = cause === -1 || (cause === 3 && !failed) ? Math.floor(run / B.retiredPerPass) : 0;
  if (failed){ leds[3] = 1; leds[4 + cause] = 1; }
  else if (passes > 0){ leds[2] = 1; for (let i = 0; i < 4; i++) leds[4 + i] = bit(passes, B.rtl.passBit + i); }
  return leds;
}
const bdVerdict = st => { if (st.p < 1) return 'OFF'; if (!st.cfg) return 'LOADING'; const l = bdLeds(st);
  return l[3] ? `FAIL c=${(8*l[7] + 4*l[6] + 2*l[5] + l[4]).toString(16)}` : l[2] ? 'PASS' : 'WAIT'; };

function bdScene(st, m){
  const k = ease(st.xr || 0), parts = [], put = (bx, svg) => parts.push({ box: bx, svg });
  const leds = bdLeds(st), power = st.p >= 1;
  let s = `<defs><filter id="bdGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="${f(1.6*INK_K)}"/></filter></defs>`;
  // shadow of the board and of the plug on the table
  const off = 10*(1 - Math.min(1, st.p*1.6)), dz = -6.6*(1 - Math.min(1, Math.max(0, st.p*1.6 - .6)/.4 || 0));
  s += castShadow(bdCorners(0, 0, 0, bdW, bdD, bdT), 0);
  // standoffs under the corners, then the PCB
  for (const [x, y] of [[4, 4], [4, 72], [72, 4], [72, 72]]) put([[x - 2.6, y - 2.6, 0], [x + 2.6, y + 2.6, bdZ0]], cyl(x, y, 0, bdZ0, 2.6, matOf('#e9e4d4'), toneI, 1));
  s += byDepth(parts.splice(0));
  s += box(0, 0, bdZ0, bdW, bdD, bdT, PCB, tone, 1) + hullInk(bdCorners(0, 0, bdZ0, bdW, bdD, bdT), 2.6);
  // flat things on the PCB top: header pads, mounting holes, silkscreen, traces
  let pads = '', holes = '';
  for (const x of [2.6, 5.14, 70.9, 73.4]) for (let i = 0; i < 20; i++){ const y = 13 + i*2.54; pads += bdDisc(x, y, bdT + .02, .95, 8); holes += bdDisc(x, y, bdT + .03, .45, 8); }
  for (const [x, y] of [[4, 4], [4, 72], [72, 4], [72, 72]]){ pads += bdDisc(x, y, bdT + .02, 2.2, 14); holes += bdDisc(x, y, bdT + .03, 1.4, 14); }
  s += fill(pads, GOLD.l) + fill(holes, '#2a2622');
  s += bdTxZ(57, 66, bdT + .05, 'iCE40HX8K-B-EVN', 2.6) + bdTxZ(12, 30, bdT + .05, 'Lattice', 3.4, SILK, 800);
  for (let i = 0; i < 8; i++) s += bdTxZ(bdLEDX + 2.9, bdLEDY(i) - .4, bdT + .05, String(i), 2.4);
  s += bdTxZ(bdLEDX + 3.6, 14, bdT + .05, 'CDONE', 1.8) + bdTxZ(bdLEDX + 3.6, 7.5, bdT + .05, 'PWR', 1.8);
  s += bdTxZ(bdLEDX - 3.4, 36, bdT + .05, 'LED0 .. LED7', 1.9);
  s += bdTraces(st, leds, k);

  // parts on the board
  const fp = bdFPGA;
  put([[fp.x0, fp.y0, bdT], [fp.x1, fp.y1, bdT + 1.4]], `<g opacity="${f(1 - .85*k)}">` + bdBox(fp.x0, fp.y0, bdT, fp.x1, fp.y1, bdT + 1.4, BLACK, 1.6)
    + bdTxZ(38.6, 31, bdT + 1.45, 'iCE40', 2.6, '#cfcac0') + bdTxZ(41.6, 31, bdT + 1.45, 'HX8K', 2.2, '#cfcac0') + bdTxZ(34.2, 31, bdT + 1.45, 'CT256', 1.6, '#9f9a90') + `</g>`);
  const ft = bdFTDI;
  put([[ft.x0, ft.y0, bdT], [ft.x1, ft.y1, bdT + 1]], bdBox(ft.x0, ft.y0, bdT, ft.x1, ft.y1, bdT + 1, BLACK, 1.3) + bdTxZ(21.6, 56.5, bdT + 1.05, 'FTDI', 2, '#cfcac0') + bdTxZ(18.6, 56.5, bdT + 1.05, '2232H', 1.5, '#9f9a90'));
  put([[30, 46, bdT], [35, 49.2, bdT + 1.3]], bdBox(30, 46, bdT, 35, 49.2, bdT + 1.3, METAL, 1) + bdTxZ(33, 47.6, bdT + 1.35, '12.000', 1.1, '#5f6668'));
  put([[46, 50, bdT], [51, 54, bdT + 1.5]], bdBox(46, 50, bdT, 51, 54, bdT + 1.5, BLACK, 1));
  for (const [x, y] of [[50, 60], [53, 60], [50, 63]]) put([[x - 1.2, y - 2.5, bdT], [x + 1.2, y + 2.5, bdT + 2.5]], bdBox(x - 1.2, y - 2.5, bdT, x + 1.2, y + 2.5, bdT + 2.5, BLACK, .8));
  // LEDs: red user LEDs, green CDONE, power
  const led = (x, y, onv, col) => { const lm = onv ? { l: mix(col, '#ffffff', .45), m: col, d: mix(col, '#000000', .25) } : { l:'#efe2da', m:'#d7c4ba', d:'#ab988d' };
    let g = bdBox(x - .9, y - 1.3, bdT, x + .9, y + 1.3, bdT + 1, lm, .8);
    if (onv){ const [X, Y] = P(x, y, bdT + 1); g += `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(3.4)}" fill="${col}" opacity=".55" filter="url(#bdGlow)"/>`; }
    return { box: [[x - .9, y - 1.3, bdT], [x + .9, y + 1.3, bdT + 1]], svg: g }; };
  for (let i = 0; i < 8; i++) parts.push(led(bdLEDX, bdLEDY(i), leds[i], '#ff3b2f'));
  parts.push(led(bdLEDX, 14, st.cfg ? 1 : 0, '#3fd16a'), led(bdLEDX, 7.5, power ? 1 : 0, '#3fd16a'));
  // USB mini-B port at the left edge, its opening facing out
  put([[21, 69, bdT], [29, 77.5, bdT + 4]], bdBox(21, 69, bdT, 29, 77.5, bdT + 4, METAL, 1.2) + (facing([0,1,0]) ? shape(on(PY(77.55), rectUV(22.5, bdT + .8, 27.5, bdT + 3.2)), '#2a2622', .6) : ''));
  // the plug and cable: lying on the table when unplugged, then lifted and pushed in
  const py = 77.5 + off, pz = bdT + dz;
  put([[20.5, py, pz], [29.5, py + 13, pz + 4]], bdBox(20.5, py, pz, 29.5, py + 13, pz + 4, BLACK, 1.4));
  if (off > .5) put([[22.6, py - 5, pz + .8], [27.4, py, pz + 3.2]], bdBox(22.6, py - 5, pz + .8, 27.4, py, pz + 3.2, METAL, .8));
  const cab = [[25, py + 13, pz + 2], [25, py + 16.5, 1.6], [31, py + 20, 1.6]];
  for (let i = 1; i < cab.length; i++) put([cab[i-1].map((v, j) => Math.min(v, cab[i][j]) - 1.6), cab[i-1].map((v, j) => Math.max(v, cab[i][j]) + 1.6)], rod(cab[i-1], cab[i], 1.6, BLACK, toneI, .9));
  s += byDepth(parts);
  if (k > 0) s += `<g opacity="${f(k)}">${bdDie(st, k)}</g>`;
  return s + bdLabels(st, k > .6);
}

/* copper traces on the top layer: shown in see-through, lit while their signal is live */
function bdTraces(st, leds, k){
  if (k <= 0) return '';
  const z = bdT + .06, run = st.cfg ? 1 : 0;
  const tr = (pts, onv, col = '#ffcf4a') => `<path d="${pd(pts.map(([x, y]) => [x, y, z]), false)}" fill="none" stroke="${onv ? col : '#9cc7a7'}" stroke-width="${onv ? 1.2 : .8}" stroke-linejoin="round" stroke-linecap="round"/>`;
  let s = '';
  for (let i = 0; i < 8; i++) s += tr([[bdFPGA.x1, 26 + i*1.5], [52 + i*.4, 26 + i*1.5], [bdLEDX - 3, bdLEDY(i)], [bdLEDX - .9, bdLEDY(i)]], leds[i], '#ff6a4c');
  s += tr([[35, 46], [35, 40], [36, bdFPGA.y1]], run, '#ffcf4a');                              // 12 MHz clock to ball J3
  s += tr([[bdFTDI.x1, 54], [28, 54], [28, 36], [bdFPGA.x0, 36]], run, '#76a0e2');                   // UART tx to FT2232H channel B
  s += tr([[46, 52], [44, 52], [42, bdFPGA.y1 + 1], [42, bdFPGA.y1]], st.p >= 1 && !st.cfg, '#c58ae0');   // SPI flash to FPGA (configuration)
  s += tr([[24, 69], [22, 64], [22, bdFTDI.y1]], st.p >= 1, '#ffcf4a');                             // USB data and power
  return `<g opacity="${f(k)}">${s}</g>`;
}

/* die map: each tile stands for 16 logic cells; tiles in use are lit in a fixed scatter (not the real placement) */
function bdDie(st, k){
  const z = bdT + .8, x0 = 31.2, y0 = 25.2, span = 11.6, cols = 16, rows = 15, tiles = cols*rows, sz = span / cols;
  const used = Math.round(tiles * B.lc.used / B.lc.available);
  const order = Array.from({length: tiles}, (_, i) => i).sort((a, b) => ((a*2654435761) >>> 0) % 997 - ((b*2654435761) >>> 0) % 997);
  const lit = new Set(order.slice(0, used));
  let litP = '', offp = '', ram = '', ramOff = '';
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
    const x = x0 + .4 + r * span/rows, y = y0 + .4 + c * sz, q = pd([[x, y, z], [x + span/rows*.8, y, z], [x + span/rows*.8, y + sz*.8, z], [x, y + sz*.8, z]]);
    if (lit.has(r*cols + c)) litP += q; else offp += q; }
  for (let i = 0; i < B.ram.available; i++){ const col = i % 2, r = Math.floor(i / 2), x = x0 + .4 + r * span/16, y = col ? y0 + span + .45 : y0 - .25,
    q = pd([[x, y, z], [x + .55, y, z], [x + .55, y + .45, z], [x, y + .45, z]]); if (i < B.ram.used) ram += q; else ramOff += q; }
  const fp = bdFPGA;
  return shape(on(PZ(bdT + .7), rectUV(fp.x0 + .4, fp.y0 + .4, fp.x1 - .4, fp.y1 - .4)), '#2b2a33', .8)
    + fill(offp, '#4b4a58') + fill(litP, '#f4b829') + fill(ramOff, '#4b4a58') + fill(ram, '#76a0e2');
}
function bdLabels(st, inside){
  const leds = bdLeds(st);
  const items = inside ? [
    { at: [36, 29, bdT + .8], text: 'LOGIC IN USE', on: !!st.cfg },
    { at: [40, 37, bdT + .8], text: 'BLOCK RAM', on: !!st.cfg },
    { at: [55, 30, bdT], text: 'LED TRACES', on: leds.some(Boolean) },
    { at: [35, 43, bdT], text: 'CLOCK', on: !!st.cfg },
    { at: [28, 45, bdT], text: 'UART TX', on: !!st.cfg },
  ] : [
    { at: [37, 31, bdT + 1.4], text: 'FPGA', on: !!st.cfg },
    { at: [20, 56, bdT + 1], text: 'FT2232H', on: st.p >= 1 },
    { at: [25, 73, bdT + 4], text: 'USB MINI-B', on: st.p >= 1 },
    { at: [32.5, 47.6, bdT + 1.3], text: 'OSCILLATOR', on: !!st.cfg },
    { at: [48.5, 52, bdT + 1.5], text: 'SPI FLASH', on: st.p >= 1 && !st.cfg },
    { at: [bdLEDX, bdLEDY(2), bdT + 1], text: 'PASS LED2', on: !!leds[2] },
    { at: [bdLEDX, bdLEDY(3), bdT + 1], text: 'FAIL LED3', on: !!leds[3] },
    { at: [bdLEDX, 14, bdT + 1], text: 'CDONE', on: !!st.cfg },
  ];
  return xrCallouts(items, [0, bdW, 0, bdD, 0, bdH]);
}

/* behaviour */
let bdUI = null;
function bdStart(st, ui){
  if (st.p >= 1 && st.live){ st.live = false; st.p = 0; st.cfg = false; st.t = 0; return; }
  st.live = true; st.t = 0; st.cfg = false;
  if (bdReduced){ st.p = 1; st.cfg = true; st.t = 1.5 * 2 ** B.rtl.heartbeatBit / F; return; }
  let load = 0;
  ui.animate(dt => {
    if (!st.live) return false;
    if (st.p < 1){ st.p = Math.min(1, st.p + dt/.9); return true; }
    if (!st.cfg){ load += dt; if (load > .45) st.cfg = true; return true; }
    st.t += dt; return true;
  });
}
// a flat board needs a wider frame than the engine's 4:3, or most of the frame is empty paper
window.FIG_A = () => innerWidth <= 560 ? .72 : .56;
bdUI = mountFigure({
  fig: '2', title: 'iCE40-HX8K Breakout Board', turn: 'full', palette: 'mint',
  size: [bdW, 108, bdH], center: [bdW/2, 54],
  state: { p: 0, cfg: false, live: false, t: 0, fault: -1 },
  scene: bdScene,
  stats: st => [{ label: 'LED verdict', value: bdVerdict(st) }],
  buttons: [
    { label: 'Run self-test', onClick: (st, ui) => bdStart(st, ui) },
    { label: 'Fault', choices: st => bdFAULTS.map(x => ({ label: x.label, current: st.fault === x.cause,
        onClick: (st, ui) => { st.fault = x.cause; st.t = 0; if (!st.live) bdStart(st, ui); } })) },
  ],
  params: (st, q) => {
    if (q.has('t')){ st.p = 1; st.cfg = true; st.live = true; st.t = +q.get('t'); }
    if (q.has('fault')) st.fault = +q.get('fault');
  },
});
xrMount(() => bdUI, () => '');
</script></body></html>
